apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: camel-main-metrics
  labels:
    app.kubernetes.io/name: camel-main
    openshift.io/user-monitoring: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: camel-main
      app.kubernetes.io/component: management
  endpoints:
  - port: management
    path: /observe/metrics
    scheme: http
    interval: 30s