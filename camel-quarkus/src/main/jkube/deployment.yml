apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: camel-quarkus
    app.kubernetes.io/runtime: camel
    app.openshift.io/runtime: camel
    camel/integration-runtime: camel
    camel.apache.org/app: camel-quarkus
  name: camel-quarkus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: camel-quarkus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: camel-quarkus
    spec:
      containers:
      - name: camel-quarkus
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8778
          name: jolokia
          protocol: TCP
